<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>예약 주문 · 별빛 리본 크리스마스샵</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Jua&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="order">
  <div class="snow" aria-hidden="true"></div>

  <header class="site-header">
    <a class="logo" href="index.html"><span>★</span> 별빛 리본</a>
    <nav>
      <a href="index.html" data-nav="home">홈</a>
      <a href="product.html?cat=ornament" data-nav="product">소품 보기</a>
      <a href="order.html" data-nav="order">예약 주문</a>
    </nav>
  </header>

  <main class="board">
    <form class="order-form" id="order-form">
      <h1 class="center">예약 주문</h1>
      <p class="center">결제는 매장에서 받아요. 접수 후 매장에서 확인 문자를 드립니다.</p>
      <p class="notice" id="preview-note" hidden>지금은 <b>미리보기 모드</b>예요. 구글 시트를 연결하기 전이라 주문이 이 브라우저에만 저장됩니다.</p>

      <label>이름 <span class="req">*</span>
        <input name="name" required maxlength="20" autocomplete="name" placeholder="홍길동">
      </label>
      <label>연락처 <span class="req">*</span>
        <input name="phone" type="tel" required pattern="0[0-9]{1,2}-?[0-9]{3,4}-?[0-9]{4}" autocomplete="tel" placeholder="010-1234-5678"
               title="010-1234-5678 형식으로 적어 주세요">
      </label>
      <div class="row">
        <label>품목 <span class="req">*</span>
          <select name="product" required></select>
        </label>
        <label>수량 <span class="req">*</span>
          <input name="qty" type="number" min="1" max="50" value="1" required>
        </label>
      </div>
      <label>픽업 희망일 <span class="req">*</span>
        <input name="date" type="date" required>
      </label>
      <label>요청사항
        <textarea name="memo" rows="3" maxlength="200" placeholder="선물 포장, 메시지 카드 문구 등"></textarea>
      </label>

      <div class="total-box">예상 금액 <strong id="order-total">0원</strong></div>

      <label class="check">
        <input type="checkbox" required>
        <span>예약 확인 연락을 위해 이름·연락처를 수집하며, 픽업 후 3개월 뒤 삭제하는 데 동의합니다.</span>
      </label>

      <p class="notice error" id="order-msg" hidden></p>
      <button class="btn" id="submit-btn" type="submit">예약 주문 보내기</button>
    </form>

    <section class="done" id="order-done" hidden>
      <div class="big">🎄</div>
      <h1>예약이 접수되었어요!</h1>
      <p>확인 후 적어 주신 연락처로 문자 드릴게요.</p>
      <dl id="done-list"></dl>
      <p class="notice" id="done-preview" hidden>미리보기 모드라 구글 시트로는 전송되지 않았어요.</p>
      <p><a class="btn gold" href="index.html">홈으로</a> <a class="btn" href="product.html?cat=ornament">더 둘러보기</a></p>
    </section>
  </main>

  <footer class="site-footer">
    <p><span data-shop="name"></span> · <span data-shop="phone"></span></p>
    <p><span data-shop="address"></span> · <span data-shop="hours"></span></p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
